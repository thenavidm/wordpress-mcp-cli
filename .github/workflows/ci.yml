name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  handshake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # A green test suite is not a working server. This starts the built
      # binary, speaks the real protocol to it over stdio, and fails if the
      # tool count is not what the docs claim.
      - name: MCP handshake
        env:
          WORDPRESS_SITE_URL: https://example.com
          WORDPRESS_USERNAME: ci
          WORDPRESS_APP_PASSWORD: aaaa bbbb cccc dddd eeee ffff
        run: node .github/scripts/handshake.mjs

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
      # PHP is not usually installed on the machine this is written on, so the
      # helper plugin's syntax is checked here or nowhere.
      - run: php -l plugin/mcp-wordpress-helper.php
